# Local profile configuration

# --- Database (MySQL) ---
spring.datasource.url=jdbc:mysql://localhost:3306/bitcomputer?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=5776
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# --- JPA ---
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.properties.hibernate.format_sql=true

# --- Redis ---
spring.data.redis.host=localhost
spring.data.redis.port=6379
# spring.data.redis.password=

# --- JWT ---
# 64바이트 이상 권장 (HS512)
jwt.secret=BitComputerSecretKeyForJWTTokenGenerationAndValidationMustBeLongEnough

