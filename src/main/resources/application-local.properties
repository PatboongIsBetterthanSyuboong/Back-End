# Local profile configuration

# --- Database (MySQL) ---
# Communications link failure / Connection refused → 이 주소·포트에 MySQL 이 안 떠 있음.
#
# (권장) Docker: 저장소의 Back-End/compose.yaml — 터미널에서 Back-End 로 이동 후:
#   docker compose up -d mysql
#   → 호스트 3307, root 비밀번호 Dd905925@ (아래 url·password 와 일치)
#
# Mac 에 Homebrew 등으로 MySQL 만 3306 에 띄운 경우: url 을 localhost:3306 으로,
# password 를 본인 root 비밀번호(예: application.properties 기본 5776)로 바꾸세요.
spring.datasource.url=jdbc:mysql://localhost:3307/bitcomputer?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=Dd905925@
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# --- JPA ---
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.properties.hibernate.format_sql=true
# JPA가 테이블을 생성한 후에 data.sql 실행하도록 설정
spring.jpa.defer-datasource-initialization=true

# --- Redis ---
spring.data.redis.host=localhost
spring.data.redis.port=6379
# spring.data.redis.password=
spring.data.redis.repositories.enabled=false

# --- ArangoDB ---
arangodb.hosts=127.0.0.1:8529
arangodb.user=root
arangodb.password=Dd905925@
arangodb.database=bitcomputer_graph

# --- JWT ---
# 64바이트 이상 권장 (HS512)
jwt.secret=BitComputerSecretKeyForJWTTokenGenerationAndValidationMustBeLongEnough

# --- Gemini (EmbeddedPrescriptionAgentStarter 가 자식 uvicorn 에 GOOGLE_API_KEY 로 전달) ---
# 우선순위: OS 환경변수 GOOGLE_API_KEY > 이 값. 이 파일은 Back-End/.gitignore 대상 — 커밋되지 않게 유지하세요.
gemini.api.key=AIzaSyA__HjepYZK4_L3qcPhgxd5Q3FzLwq0jrM

# --- Python 처방 추천 에이전트 (FastAPI) ---
# prescription_api.py 를 uvicorn 으로 8001 포트에 띄우는 것이 기본값
ai.prescription-agent.base-url=http://localhost:8001
ai.prescription-agent.path=/api/agent/prescription/recommend
ai.prescription-agent.fetch-top-rx-from-arango=true
ai.prescription-agent.arango-top-rx-limit=80
# Back-End 를 프로젝트의 Back-End 디렉터리에서 실행하면 자동으로 uvicorn 이 함께 뜹니다(이미 :8001 이 열려 있으면 건너뜀).
ai.prescription-agent.embed.enabled=true
# embed.python-command 기본값 python3 가 Anaconda 등(uvicorn 미설치)이면, EmbeddedPrescriptionAgentStarter 가
# 프로젝트 루트 .venv/bin/python 을 자동으로 찾습니다. 없으면 루트에서: pip install -r GraphDB/langchain_graph_qa/requirements.txt

