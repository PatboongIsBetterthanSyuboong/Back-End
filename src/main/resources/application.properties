spring.application.name=BitComputer

# Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3307/bitcomputer?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=5776
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.properties.hibernate.format_sql=true

# SQL initialization
spring.sql.init.mode=always

# Redis Configuration
spring.data.redis.host=localhost
spring.data.redis.port=6379
# Redis 전용 리포지토리 미사용 시 스캔 비활성화 (JPA/Arango와 혼선·INFO 로그 감소)
spring.data.redis.repositories.enabled=false
#spring.data.redis.password= password

# JWT Configuration
jwt.secret=BitComputerSecretKeyForJWTTokenGenerationAndValidationMustBeLongEnough

# AI API Configuration
ai.api.base-url=http://localhost:5000

# Gemini API
gemini.api.key=GEMINI_API_KEY

# RestTemplate: 처방 에이전트(Spring→Python→Gemini) 등 LLM 응답 대기(밀리초)
http.client.rest-template.connect-timeout-ms=5000
http.client.rest-template.read-timeout-ms=180000

# Python prescription agent (FastAPI, GraphDB/langchain_graph_qa/prescription_api.py)
ai.prescription-agent.base-url=http://localhost:8001
ai.prescription-agent.path=/api/agent/prescription/recommend
# true 이면 Python 이 patient_id 로 ArangoDB 에서 top_rx 를 보강함 (Spring 에서 top_rx 가 비어 있을 때만)
ai.prescription-agent.fetch-top-rx-from-arango=true
ai.prescription-agent.arango-top-rx-limit=80
# Spring 과 함께 uvicorn prescription_api 를 자식 프로세스로 띄울지(로컬 편의). 프로덕션에서는 false 유지.
ai.prescription-agent.embed.enabled=false
ai.prescription-agent.embed.working-directory=../GraphDB/langchain_graph_qa
ai.prescription-agent.embed.python-command=python3
ai.prescription-agent.embed.host=0.0.0.0
ai.prescription-agent.embed.skip-if-healthy=true
ai.prescription-agent.embed.startup-timeout-ms=90000
# 상병 코드별 Arango 코호트 처방 빈도(top_rx·similar_outcomes 보강)
ai.prescription-agent.fetch-cohort-rx-from-arango=true
ai.prescription-agent.arango-cohort-rx-limit=40

# 활성 프로필 (로컬 실행 기본값)
spring.profiles.active=local